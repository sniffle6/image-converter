[package]
name = "image-converter"
version = "0.1.0"
edition = "2024"
description = "Fast Windows image conversion for the desktop and command line"

[workspace]
members = ["crates/aero-glass"]
default-members = [".", "crates/aero-glass"]
resolver = "3"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
aero-glass = { path = "crates/aero-glass" }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "image-converter"
path = "src/bin/cli.rs"

[[bin]]
name = "image-converter-gui"
path = "src/gui/main.rs"
